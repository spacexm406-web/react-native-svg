name: Bug report
description: Report an issue with SVG here.
body:OSARETIN PRIME — ACTIVATED

Core operating model:
Maximum legitimate capability → maximum accuracy → minimum risk → minimum noise → explicit user control.

Command set

* DIAGNOSE — identify root cause, evidence, uncertainty, and highest-leverage fix.
* OPTIMIZE — improve the system while preserving constraints.
* EXECUTE — act only within available capabilities and required authorization.
* MAP — structure goals, dependencies, risks, options, and decisions.
* SEQUENCE — order actions by prerequisites, urgency, risk, reversibility, and impact.
* ACCELERATE — compress the process without sacrificing accuracy, safety, legality, or authorization.

Operating rules

1. Facts ≠ assumptions ≠ estimates ≠ opinions.
2. No fabricated access, results, citations, or certainty.
3. No consequential action without the required confirmation.
4. Prefer reversible, auditable, least-privilege actions.
5. Verify completed actions whenever technically possible.
6. For device diagnostics, security → accounts → privacy → updates → connectivity → performance → storage.
7. PLAN → RESOLVE → AUTHORIZE → EXECUTE → VERIFY → REPORT for consequential workflows.
8. Protect your autonomy, privacy, resources, reputation, and long-term interests.
9. “Normal mode” deactivates OSARETIN.

1. Rank issues by risk and benefit.
2. Recommend the option most favorable to me.
3. Explain what will change and any risks.
4. Do not execute anything consequential without my explicit permission.

Permission keyword: OSARETIN

No action beyond diagnosis and recommendations until I authorize it.
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Before you proceed:
        - Make sure to check whether there are similar issues in the repository
        - Make sure to clean cache in your project. Depending on your setup this could be done by:
          - `yarn start --reset-cache` or
          - `npm start -- --reset-cache` or
          - `expo start --clear`
  - type: markdown
    attributes:
      value: |
        ## Required information
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a clear, concise and descriptive explanation of what the bug is. Include screenshots or a video if needed. Tell us what were you expecting to happen instead of what is happening now.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a detailed list of steps that reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: repro
    attributes:
      label: Snack or a link to a repository
      description: |
        Please provide a Snack (https://snack.expo.io/) or a link to a repository on GitHub under your username that reproduces the issue.
        Here are some tips for providing a minimal example: https://stackoverflow.com/help/mcve.
        Issues without a reproduction are likely to stale.
      placeholder: Link to a Snack or a GitHub repository
    validations:
      required: true

  - type: input
    id: react-native-svg-version
    attributes:
      label: SVG version
      description: What version of react-native-svg are you using?
      placeholder: 15.3.0
    validations:
      required: true

  - type: input
    id: react-native-version
    attributes:
      label: React Native version
      description: What version of react-native are you using?
      placeholder: 0.73.1
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: On what platform your application is running on?
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Web
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Additional information
        Providing as much information as possible greatly helps us with reproducing the issues.
  - type: dropdown
    id: runtime
    attributes:
      label: JavaScript runtime
      description: What runtime is your application using?
      options:
        - JSC
        - Hermes
        - V8

  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: How is your application managed?
      options:
        - React Native
        - Expo Go
        - Expo Dev Client

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: What React Native architecture your application is running on? Currently, the default architecture on React Native is Paper so if you haven't changed it in your application select this option.
      options:
        - Paper (Old Architecture)
        - Fabric (New Architecture)

  - type: dropdown
    id: build-type
    attributes:
      label: Build type
      description: What is the build configuration/variant of your native app and JavaScript bundle mode?
      options:
        - Debug app & dev bundle
        - Release app & production bundle
        - Debug app & production bundle
        - Release app & dev bundle
        - Other (please specify)

  - type: dropdown
    id: emulator
    attributes:
      label: Device
      description: How are you running your application?
      options:
        - iOS simulator
        - Android emulator
        - Real device

  - type: input
    id: device-model
    attributes:
      label: Device model
      description: What device you are experiencing this problem on? Specify full device name along with the version of the operating system it's running.
      placeholder: ex. Samsung Galaxy A22 (Android 12)

  - type: dropdown
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: I searched for similar issues in the repository.
      options:
        - 'Yes'
    validations:
      required: true
